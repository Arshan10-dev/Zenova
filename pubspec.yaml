name: cadence
description: "Cadence — a premium offline music player."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  provider: ^6.1.2

  # --- Audio playback & background/media-session control ---
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  rxdart: ^0.28.0

  # --- Device audio scanning (MediaStore query + artwork) ---
  on_audio_query_pluse: ^2.9.4

  # --- Permissions ---
  permission_handler: ^11.3.1

  # --- Manual file/folder import ---
  file_picker: ^8.1.7

  # --- Local persistence ---
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.1.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # --- UI / design ---
  google_fonts: ^6.2.1
  palette_generator: ^0.3.3+3
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0

  # --- Utilities ---
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_ce_generator: ^1.5.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # Uncomment and point to real asset files if you add a logo / placeholder
  # artwork image before building. See README "Assets" section.
  # assets:
  #   - assets/images/
